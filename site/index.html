<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arborista – Audit your Figma branches</title>
  <meta name="description" content="Arborista is a macOS app that audits the branches in your Figma folders.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Radio+Canada+Big:wght@400..700&display=swap">
  <style>
    :root {
      --bg: #1e1e1e;
      --text: #f6f6f6;
      --muted: #9d9d9d;
      --accent: #ecf6af;
      --on-accent: #1e1e1e;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    html { font-size: 17px; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Radio Canada Big", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }
    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 420px;
    }
    .icon { width: 96px; height: 96px; border-radius: 22px; }
    h1 { margin: 24px 0 8px; font-size: 32px; font-weight: 650; letter-spacing: -0.02em; }
    .tagline { margin: 0 0 32px; color: var(--muted); font-size: 17px; line-height: 1.5; text-wrap: balance; }
    .button {
      display: inline-block;
      padding: 0.75rem 1rem;
      background: var(--accent);
      color: var(--on-accent);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 150ms ease-out;
    }
    .button:hover { background: hsl(68, 80%, 88%); }
    .button:active { background: hsl(68, 80%, 95%); }
    .button:focus-visible { outline: 2px solid #9d9d9d; outline-offset: 2px; }
    .repo:focus-visible { outline: 2px solid #9d9d9d; outline-offset: 3px; }
    .version { margin: 10px 0 0; min-height: 1.2em; color: var(--muted); font-size: 13px; }
    .repo { margin-top: 20px; color: var(--muted); font-size: 14px; text-decoration: none; border-radius: 6px; }
    .repo:hover { color: var(--text); text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="icon.png" alt="Arborista app icon" width="96" height="96">
    <h1>Arborista</h1>
    <p class="tagline">Audit your Figma branches</p>
    <a id="download" class="button" href="https://github.com/sntiagomoreno/arborista/releases/latest">Download for macOS</a>
    <p id="version" class="version"></p>
    <a class="repo" href="https://github.com/sntiagomoreno/arborista">View on GitHub</a>
  </main>
  <script>
    (function () {
      var btn = document.getElementById("download");
      var ver = document.getElementById("version");
      fetch("https://api.github.com/repos/sntiagomoreno/arborista/releases/latest", {
        headers: { Accept: "application/vnd.github+json" }
      })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (rel) {
          var dmg = (rel.assets || []).find(function (a) { return /\.dmg$/i.test(a.name); });
          if (!dmg) return;
          btn.href = dmg.browser_download_url;
          if (rel.tag_name) ver.textContent = rel.tag_name;
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
